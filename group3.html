<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访烟火生活 · 弋阳西街</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --ink: #2a231c;
        --paper: #f9f2e4;
        --cinnabar: #b03a2c;
        --lantern: #d4622a;
        --gold: #d9a74f;
        --night-text: #efe4cf;
    }
    html, body { height: 100%; }
    body {
        font-family: "SimSun", "宋体", "Songti SC", "Noto Serif SC", serif;
        color: var(--ink);
        overflow: hidden;
        background: #1a1430;
        transition: color 0.8s ease;
    }
    body.night { color: var(--night-text); }

    /* ============ 昼夜双层氛围背景 ============ */
    .sky { position: fixed; inset: 0; z-index: 0; transition: opacity 1.1s ease; }
    .sky-day {
        opacity: 1;
        background:
            radial-gradient(circle at 78% 12%, rgba(255, 236, 190, 0.95), rgba(255, 205, 140, 0) 42%),
            linear-gradient(180deg, #f3d9a8 0%, #eec792 45%, #e8b47c 72%, #d99c6b 100%);
    }
    .sky-night {
        opacity: 0;
        background:
            radial-gradient(circle at 22% 16%, rgba(255, 235, 190, 0.28), rgba(255, 235, 190, 0) 22%),
            radial-gradient(circle at 80% 90%, rgba(176, 58, 44, 0.22), rgba(176, 58, 44, 0) 55%),
            linear-gradient(180deg, #100f26 0%, #211a3e 45%, #3d2547 78%, #4d2c3d 100%);
    }
    body.night .sky-day { opacity: 0; }
    body.night .sky-night { opacity: 1; }

    /* 日轮 / 月亮 */
    .orb {
        position: fixed; z-index: 1; width: 130px; height: 130px; border-radius: 50%;
        top: 7%; right: 10%; transition: opacity 1s ease, transform 1.2s ease;
    }
    .orb-sun {
        background: radial-gradient(circle, #ffeec2 0%, #f7c97e 55%, rgba(247, 201, 126, 0) 72%);
        filter: blur(1px); opacity: 1;
    }
    .orb-moon {
        opacity: 0; top: 8%; right: 13%; width: 92px; height: 92px;
        background: radial-gradient(circle at 38% 34%, #fff8e4 0%, #efe2bd 60%, rgba(239, 226, 189, 0) 72%);
        box-shadow: 0 0 60px rgba(255, 240, 200, 0.35);
    }
    body.night .orb-sun { opacity: 0; transform: translateY(-30px); }
    body.night .orb-moon { opacity: 1; }
    .star { position: fixed; z-index: 1; width: 3px; height: 3px; border-radius: 50%;
        background: #fff3d4; opacity: 0; transition: opacity 1s ease; animation: twinkle 3s ease-in-out infinite; }
    body.night .star { opacity: 0.85; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }

    /* 夜幕下檐角悬挂的灯笼剪影 */
    .hang-lanterns { position: fixed; z-index: 1; top: 0; left: 0; right: 0; height: 150px;
        pointer-events: none; opacity: 0; transition: opacity 1s ease; }
    body.night .hang-lanterns { opacity: 0.9; }
    .hl { position: absolute; top: -10px; width: 34px; transform-origin: top center; animation: sway 4.5s ease-in-out infinite; }
    .hl .cord { width: 2px; height: 46px; margin: 0 auto; background: rgba(20, 12, 8, 0.65); }
    .hl .body { width: 30px; height: 38px; margin: -2px auto 0; border-radius: 8px 8px 10px 10px;
        background: radial-gradient(circle at 50% 35%, #ffb066, #d4532a 70%);
        box-shadow: 0 0 26px rgba(240, 130, 60, 0.75); }
    .hl .tail { width: 3px; height: 16px; margin: 0 auto; background: #c44a26; }
    @keyframes sway { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }

    /* 漂浮光点：白日浮尘 / 夜为流萤 */
    .motes { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .mote { position: absolute; bottom: -20px; border-radius: 50%;
        background: rgba(190, 140, 70, 0.55);
        animation: rise linear infinite; }
    body.night .mote {
        background: radial-gradient(circle, rgba(255, 220, 150, 0.95), rgba(255, 190, 110, 0));
        box-shadow: 0 0 8px rgba(255, 200, 120, 0.8);
    }
    @keyframes rise {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        12% { opacity: 0.9; }
        88% { opacity: 0.7; }
        100% { transform: translateY(-108vh) translateX(40px); opacity: 0; }
    }

    .stage-wrap { position: relative; z-index: 5; height: 100vh; display: flex; flex-direction: column; }

    /* ============ 顶部 ============ */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 26px 10px;
    }
    .back-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 16px; font-family: inherit; font-size: 15px;
        color: var(--ink); background: rgba(249, 242, 228, 0.85);
        border: 1px solid rgba(125, 97, 71, 0.55); border-radius: 4px;
        cursor: pointer; transition: all 0.25s ease;
    }
    .back-btn:hover { background: #fff7e8; transform: translateX(-2px); }
    body.night .back-btn { color: var(--night-text); background: rgba(30, 24, 52, 0.55); border-color: rgba(239, 228, 207, 0.4); }
    body.night .back-btn:hover { background: rgba(60, 45, 90, 0.7); }
    .page-title {
        font-family: "STXingkai", "华文行楷", "KaiTi", "楷体", serif;
        font-size: clamp(24px, 3.2vw, 34px); letter-spacing: 0.18em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
    }
    .page-title .verb { color: var(--cinnabar); }
    body.night .page-title .verb { color: #e8694f; }
    .sky-badge {
        display: inline-flex; align-items: center; gap: 8px;
        font-family: "KaiTi", "楷体", serif; font-size: 15px; letter-spacing: 0.18em;
        padding: 6px 16px; border-radius: 30px;
        background: rgba(249, 242, 228, 0.85); color: #8a5a2b;
        border: 1px solid rgba(212, 98, 42, 0.5);
        transition: all 0.6s ease;
    }
    .sky-badge .ico { width: 16px; height: 16px; }
    body.night .sky-badge {
        background: rgba(30, 24, 52, 0.6); color: #f3d9a6; border-color: rgba(217, 167, 79, 0.6);
    }
    .sky-badge .ico-moon { display: none; }
    body.night .sky-badge .ico-sun { display: none; }
    body.night .sky-badge .ico-moon { display: block; }

    /* ============ 走马盘舞台 ============ */
    .stage {
        flex: 1; min-height: 0; position: relative; z-index: 1;
        display: flex; align-items: center; justify-content: center;
        padding: 0 60px;
    }
    .deck { position: relative; width: 100%; height: 100%; perspective: 1500px; }
    .slide {
        position: absolute; top: 50%; left: 50%;
        width: var(--cw, min(56vw, 600px));
        aspect-ratio: 4 / 3;
        max-height: 100%;
        margin: 0;
        transform-style: preserve-3d;
        transition: transform 0.75s cubic-bezier(0.24, 0.85, 0.3, 1),
                    opacity 0.6s ease, filter 0.6s ease;
        cursor: pointer;
        will-change: transform;
    }
    .slide.port { width: min(34vw, 380px); aspect-ratio: 3 / 4; }
    .photo-card {
        position: absolute; inset: 0;
        background: #fbf5ea;
        padding: 12px 12px 12px;
        border-radius: 4px;
        box-shadow: 0 26px 60px rgba(20, 10, 4, 0.45);
        transform: rotate(-1.2deg);
        transition: transform 0.5s ease;
    }
    .slide.is-current .photo-card { transform: rotate(-0.4deg); }
    .photo-card .tape {
        position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-2deg);
        width: 110px; height: 28px;
        background: rgba(212, 98, 42, 0.28);
        border-left: 1px dashed rgba(125, 97, 71, 0.25);
        border-right: 1px dashed rgba(125, 97, 71, 0.25);
    }
    .photo-box { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 2px; background: #221a2e; }
    .photo-box > img.main-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-cap {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 18px 14px 10px;
        font-family: "KaiTi", "楷体", serif; font-size: 15px; letter-spacing: 0.22em; color: #fff;
        text-align: center; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
        background: linear-gradient(0deg, rgba(18, 12, 8, 0.66), rgba(18, 12, 8, 0));
        pointer-events: none;
    }
    .day-stamp {
        position: absolute; top: 10px; right: 10px; z-index: 4;
        font-family: "KaiTi", "楷体", serif; font-size: 12px; letter-spacing: 0.12em;
        padding: 3px 9px; border-radius: 3px; color: #fff;
        background: rgba(212, 98, 42, 0.85);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .day-stamp.night-stamp { background: rgba(52, 46, 96, 0.85); border: 1px solid rgba(217, 167, 79, 0.7); }

    /* 当前片上的观察光点：平时常显，侧片隐藏 */
    .find-dot {
        position: absolute; z-index: 6; width: 16px; height: 16px;
        transform: translate(-50%, -50%); border-radius: 50%;
        display: none; cursor: pointer; padding: 0; border: none; background: transparent;
    }
    .slide.is-current .find-dot { display: block; }
    .find-dot::before {
        content: ""; position: absolute; inset: 3px; border-radius: 50%;
        background: radial-gradient(circle, #ffe9b0, #e0853a);
        box-shadow: 0 0 10px rgba(255, 200, 110, 0.95);
    }
    .find-dot::after {
        content: ""; position: absolute; inset: -4px; border-radius: 50%;
        border: 2px solid rgba(255, 220, 150, 0.8);
        animation: dotPulse 1.7s ease-out infinite;
    }
    .find-dot:hover::before, .find-dot.on::before { background: radial-gradient(circle, #fff6d8, var(--cinnabar)); }
    .find-dot:hover { transform: translate(-50%, -50%) scale(1.25); }
    @keyframes dotPulse { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }

    /* 两侧换幕大箭头 */
    .nav-arrow {
        position: absolute; top: 42%; z-index: 20;
        width: 54px; height: 54px; border-radius: 50%;
        font-size: 20px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        color: #5a4636; background: rgba(249, 242, 228, 0.82);
        border: 1px solid rgba(125, 97, 71, 0.5);
        box-shadow: 0 8px 22px rgba(30, 16, 6, 0.28);
        cursor: pointer; transition: all 0.25s ease;
    }
    .nav-arrow:hover { background: #fff7e8; color: var(--cinnabar); transform: translateY(-50%) scale(1.08); }
    .nav-prev { left: 26px; }
    .nav-next { right: 26px; }
    .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    body.night .nav-arrow { color: var(--night-text); background: rgba(30, 24, 52, 0.6); border-color: rgba(239, 228, 207, 0.35); }
    body.night .nav-arrow:hover { background: rgba(80, 60, 110, 0.8); color: #ffd9a0; }
    /* 抵消 hover 的 translateY：默认也要垂直居中定位 */
    .nav-arrow { transform: translateY(-50%); }

    /* ============ 下方手札区（简介 / 放大镜发现 二选一） ============ */
    .journal {
        position: relative; z-index: 10;
        display: flex; justify-content: center;
        padding: 4px 90px 0;
    }
    .journal-card {
        position: relative;
        width: min(820px, 100%);
        background: rgba(249, 242, 228, 0.95);
        border: 1px solid rgba(125, 97, 71, 0.35);
        border-radius: 10px 10px 0 0;
        box-shadow: 0 -8px 34px rgba(20, 10, 4, 0.28);
        padding: 14px 26px 12px;
        color: var(--ink);
        min-height: 128px;
    }
    .journal-card::before, .journal-card::after {  /* 装订红线 */
        content: ""; position: absolute; top: 0; width: 34px; height: 10px;
        background: repeating-linear-gradient(90deg, var(--cinnabar) 0 4px, transparent 4px 8px);
        opacity: 0.55;
    }
    .journal-card::before { left: 18px; }
    .journal-card::after { right: 18px; }
    .j-meta { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 4px; }
    .j-seal {
        width: 30px; height: 30px; border-radius: 5px;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--cinnabar); color: #fff;
        font-family: "KaiTi", "楷体", serif; font-size: 17px;
        box-shadow: 0 2px 6px rgba(176, 58, 44, 0.5);
    }
    .j-cat { font-family: "KaiTi", "楷体", serif; font-size: 14px; letter-spacing: 0.16em; color: #8a6a48; }
    .j-title {
        text-align: center;
        font-family: "STXingkai", "华文行楷", "KaiTi", "楷体", serif;
        font-size: clamp(22px, 2.6vw, 28px); letter-spacing: 0.14em; margin-bottom: 5px;
    }
    .j-intro { font-size: 14px; line-height: 1.85; text-align: center; max-width: 720px; margin: 0 auto; }
    .j-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 8px; }
    .j-tags span {
        font-family: "KaiTi", "楷体", serif; font-size: 12.5px; letter-spacing: 0.06em;
        color: #7a5230; background: rgba(212, 98, 42, 0.09);
        border: 1px solid rgba(212, 98, 42, 0.3); border-radius: 20px; padding: 2px 11px;
    }
    .j-pane { transition: opacity 0.3s ease, transform 0.3s ease; }
    .j-pane.hidden { display: none; }

    /* 发现手札 */
    .notes-head { display: flex; align-items: center; gap: 12px; }
    .notes-head .j-seal { background: var(--lantern); }
    .notes-title { font-family: "KaiTi", "楷体", serif; font-size: 20px; letter-spacing: 0.1em; color: var(--cinnabar); }
    .notes-count { font-size: 13px; color: #8a6a48; }
    .notes-desc { font-size: 14px; line-height: 1.8; margin-top: 4px; }
    .notes-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .mini-btn {
        font-family: "KaiTi", "楷体", serif; font-size: 13.5px;
        width: 32px; height: 32px; border-radius: 50%;
        border: 1px solid rgba(125, 97, 71, 0.5); background: transparent; color: #6b533c;
        cursor: pointer; transition: all 0.2s ease;
    }
    .mini-btn:hover { background: var(--paper-deep); color: var(--cinnabar); }
    .exit-lens {
        width: auto; border-radius: 20px; padding: 0 14px; height: 32px;
        color: #fff; background: var(--lantern); border-color: var(--lantern);
    }
    .exit-lens:hover { background: var(--cinnabar); color: #fff; }
    .notes-hint { text-align: center; font-family: "KaiTi", "楷体", serif; font-size: 13px; color: #9a7b58; margin-top: 3px; }

    /* ============ 底部昼夜进度带（同时作为避让音乐按钮的 controls） ============ */
    .controls {
        position: relative; z-index: 10;
        padding: 10px 30px 16px;
        display: flex; align-items: center; justify-content: center;
    }
    .rail { position: relative; display: flex; align-items: flex-start; gap: clamp(10px, 4vw, 46px); }
    .rail::before {
        content: ""; position: absolute; left: 6%; right: 6%; top: 19px; height: 2px;
        background: linear-gradient(90deg, rgba(217, 167, 79, 0.9), rgba(176, 58, 44, 0.8), rgba(90, 80, 150, 0.9));
        opacity: 0.7; border-radius: 2px;
    }
    .node {
        position: relative; z-index: 2; width: 40px;
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        background: none; border: none; cursor: pointer; padding: 0;
    }
    .node .lantern {
        width: 38px; height: 38px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: "KaiTi", "楷体", serif; font-size: 15px;
        color: rgba(90, 66, 40, 0.75);
        background: rgba(249, 242, 228, 0.88);
        border: 2px solid rgba(125, 97, 71, 0.45);
        transition: all 0.35s ease;
    }
    .node:hover .lantern { transform: translateY(-3px); border-color: var(--cinnabar); color: var(--cinnabar); }
    .node.on .lantern {
        background: radial-gradient(circle at 50% 35%, #ffc37a, var(--lantern) 70%);
        border-color: #ffe2b0; color: #fff;
        box-shadow: 0 0 20px rgba(240, 150, 70, 0.85), 0 4px 10px rgba(0, 0, 0, 0.3);
        transform: scale(1.12) translateY(-2px);
    }
    .node.on.night-node .lantern {
        background: radial-gradient(circle at 50% 35%, #b3a8ff, #4a3f8c 75%);
        border-color: #cfc4ff;
        box-shadow: 0 0 20px rgba(150, 135, 255, 0.7), 0 4px 10px rgba(0, 0, 0, 0.35);
    }
    .node .nm { font-family: "KaiTi", "楷体", serif; font-size: 11.5px; letter-spacing: 0.05em;
        color: rgba(60, 45, 30, 0.75); white-space: nowrap; transition: color 0.3s; }
    body.night .node .nm { color: rgba(239, 228, 207, 0.8); }
    body.night .rail::before { opacity: 0.55; }
    .node .phase { font-size: 11px; line-height: 1; margin-top: -2px; }
    .node .phase.dn { color: #b5742a; }
    .node .phase.nt { color: #c9bff2; }

    @media (max-width: 860px) {
        .slide { width: var(--cw, 64vw); }
        .slide.port { width: var(--cw, 44vw); }
        .stage { padding: 0 10px; }
        .nav-arrow { width: 42px; height: 42px; }
        .nav-prev { left: 8px; } .nav-next { right: 8px; }
        .journal { padding: 4px 14px 0; }
        .journal-card { padding: 12px 16px 10px; min-height: 120px; }
        .j-intro { font-size: 13px; line-height: 1.7; max-height: 84px; overflow-y: auto; }
        .node .nm { display: none; }
        .rail { gap: 8px; }
        .group-label-hide { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>

<!-- 昼夜天幕 -->
<div class="sky sky-day"></div>
<div class="sky sky-night"></div>
<div class="orb orb-sun"></div>
<div class="orb orb-moon"></div>
<div class="hang-lanterns" id="hangLanterns"></div>
<div class="motes" id="motes"></div>

<div class="stage-wrap">
    <header class="topbar">
        <button class="back-btn" onclick="if(window.self!==window.top){window.top.postMessage({type:'xijie-back'},'*');}else{location.href='index.html';}">← 返回首页</button>
        <div class="page-title"><span class="verb">访</span>烟火生活</div>
        <div class="sky-badge" id="skyBadge">
            <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="#b5742a" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
            <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="#f3d9a6" stroke-width="2"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>
            <span id="skyText">白日西街</span>
        </div>
    </header>

    <section class="stage" id="stage">
        <div class="deck" id="deck"></div>
        <button class="nav-arrow nav-prev" id="navPrev" aria-label="上一幕">◄</button>
        <button class="nav-arrow nav-next" id="navNext" aria-label="下一幕">►</button>
    </section>

    <section class="journal">
        <div class="journal-card">
            <div class="j-pane" id="introPane">
                <div class="j-meta">
                    <span class="j-seal" id="jSeal">壹</span>
                    <span class="j-cat" id="jCat">白日 · 市井闲趣</span>
                </div>
                <h2 class="j-title" id="jTitle"></h2>
                <p class="j-intro" id="jIntro"></p>
                <div class="j-tags" id="jTags"></div>
            </div>
            <div class="j-pane hidden" id="notesPane">
                <div class="notes-head">
                    <span class="j-seal">察</span>
                    <span class="notes-title" id="nTitle"></span>
                    <span class="notes-count" id="nCount"></span>
                    <div class="notes-tools">
                        <button class="mini-btn" id="nPrev" aria-label="上一处见闻">↑</button>
                        <button class="mini-btn" id="nNext" aria-label="下一处见闻">↓</button>
                        <button class="mini-btn exit-lens" id="nExit">返回简介</button>
                    </div>
                </div>
                <p class="notes-desc" id="nDesc"></p>
                <p class="notes-hint">点击照片上发光的小光点，把这处老街见闻收录进手札</p>
            </div>
        </div>
    </section>

    <footer class="controls">
        <div class="rail" id="rail"></div>
    </footer>
</div>

<script>
(function () {
    /* ============ 场景数据（文件名按实际画面映射） ============ */
    var scenes = [
        {
            cat: "白日 · 市井闲趣", title: "古玩地摊", night: false, port: false,
            img: "image/项目3/7.jpg", cap: "长廊灯影 · 蹲身淘珍",
            intro: "白日的西街古巷，廊下挂满一盏盏国风灯笼。古玩小铺沿街摆开，玉石、把件、珠串、旧书在一方黑布上铺陈。摊主与客人蹲在地摊前，就着一件小玉件细细端详、慢慢议价，老街藏着的正是这份不慌不忙的市井闲趣。",

        navPrev.disabled = cur === 0;
        navNext.innerHTML = cur >= scenes.length - 1 ? "↺" : "►";

        document.body.classList.toggle("night", s.night);
        skyText.textContent = s.night ? "夜幕西街" : "白日西街";

        // 手札换幕动画
        var pane = document.getElementById("introPane");
        pane.style.opacity = "0"; pane.style.transform = "translateY(8px)";
        setTimeout(function () {
            jSeal.textContent = CN[cur];
            jCat.textContent = s.cat;
            jTitle.textContent = s.title;
            jIntro.textContent = s.intro;
            jTags.innerHTML = s.tags.map(function (t) { return "<span>" + t + "</span>"; }).join("");
            pane.style.opacity = "1"; pane.style.transform = "translateY(0)";
        }, 240);
    }
    document.getElementById("introPane").style.transition = "opacity .3s ease, transform .3s ease";

    navPrev.addEventListener("click", function () { if (cur > 0) goTo(cur - 1); });
    navNext.addEventListener("click", function () {
        if (cur >= scenes.length - 1) { closeFind(); cur = 0; render(); }
        else goTo(cur + 1);
    });
    document.addEventListener("keydown", function (e) {
        if (viewing) {
            var nn = scenes[cur].finds.length;
            if (e.key === "ArrowUp" || e.key === "ArrowLeft") selectFind((curFind - 1 + nn) % nn);
            if (e.key === "ArrowDown" || e.key === "ArrowRight") selectFind((curFind + 1) % nn);
            if (e.key === "Escape") closeFind();
            return;
        }
        if (e.key === "ArrowLeft" && cur > 0) goTo(cur - 1);
        if (e.key === "ArrowRight") {
            if (cur < scenes.length - 1) goTo(cur + 1);
            else { cur = 0; render(); }
        }
    });

    /* ============ 光点见闻手札（点击图中光点，注解就地展开在手札卡） ============ */
    var viewing = false, curFind = 0;
    var introPane = document.getElementById("introPane");
    var notesPane = document.getElementById("notesPane");
    var nTitle = document.getElementById("nTitle");
    var nCount = document.getElementById("nCount");
    var nDesc = document.getElementById("nDesc");

    function dotsOf(i) { return slides[i].querySelectorAll(".find-dot"); }

    function openFind(sceneIdx, fi) {
        viewing = true;
        introPane.classList.add("hidden");
        notesPane.classList.remove("hidden");
        selectFind(fi);
    }
    function closeFind() {
        if (!viewing) return;
        viewing = false;
        dotsOf(cur).forEach(function (d) { d.classList.remove("on"); });
        notesPane.classList.add("hidden");
        introPane.classList.remove("hidden");
    }
    function selectFind(i) {
        var s = scenes[cur], f = s.finds[i];
        curFind = i;
        nTitle.textContent = (i + 1) + ". " + f.t;
        nCount.textContent = "见闻 " + (i + 1) + " / " + s.finds.length;
        nDesc.textContent = f.d;
        dotsOf(cur).forEach(function (d, di) { d.classList.toggle("on", di === i); });
    }
    document.getElementById("nPrev").addEventListener("click", function () {
        if (!viewing) return;
        var n = scenes[cur].finds.length;
        selectFind((curFind - 1 + n) % n);
    });
    document.getElementById("nNext").addEventListener("click", function () {
        if (!viewing) return;
        selectFind((curFind + 1) % scenes[cur].finds.length);
    });
    document.getElementById("nExit").addEventListener("click", closeFind);

    /* 初始：先按舞台实际宽高算出照片尺寸，保证不溢出遮挡手札 */
    var stageEl = document.getElementById("stage");
    function fitStage() {
        var r = stageEl.getBoundingClientRect();
        if (r.height < 40) return;
        var narrow = window.matchMedia("(max-width: 860px)").matches;
        var maxW = narrow ? r.width * 0.76 : r.width * 0.6;
        var byH = (r.height - 10) * (4 / 3);   // 4:3 照片在舞台高度内允许的最大宽
        var w = Math.max(200, Math.min(maxW, 600, byH));
        deck.style.setProperty("--cw", w + "px");
        layoutDeck();
    }
    window.addEventListener("resize", fitStage);
    if (window.ResizeObserver) { new ResizeObserver(fitStage).observe(stageEl); }
    fitStage();
    render();
})();
</script>
<script src="music.js" defer></script>
</body>
</html>
